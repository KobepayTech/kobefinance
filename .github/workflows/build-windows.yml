name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer (e.g. 0.1.0)"
        default: "0.1.0"
  push:
    tags:
      - "v*"
    branches:
      - "claude/clone-finceptterminal-1mfyu6"
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the release and attach the installer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="0.1.0"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building installer version ${version}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build app with PyInstaller
        working-directory: packaging
        run: pyinstaller kobefinance.spec --noconfirm

      - name: Sanity-check the build output
        shell: bash
        run: test -f packaging/dist/KobeFinanceTerminal/KobeFinanceTerminal.exe

      - name: Move build to repo root for Inno Setup
        shell: bash
        run: |
          mkdir -p dist
          mv packaging/dist/KobeFinanceTerminal dist/KobeFinanceTerminal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Sanity-check the installer
        shell: bash
        run: test -f dist/installer/KobeFinanceTerminal-${{ steps.ver.outputs.version }}-windows-x64-setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KobeFinanceTerminal-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/installer/*.exe

      # Publish a downloadable GitHub Release. On a tag build this uses the tag;
      # on a branch build it creates/updates the v<version> tag + release
      # server-side (via GITHUB_TOKEN), so the installer is available at
      # /releases/latest without needing a local tag push.
      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: KobeFinance Terminal v${{ steps.ver.outputs.version }}
          body: |
            KobeFinance Terminal v${{ steps.ver.outputs.version }} — Windows x64 installer.

            Download `KobeFinanceTerminal-${{ steps.ver.outputs.version }}-windows-x64-setup.exe`
            below and run it. Silent install:
            `KobeFinanceTerminal-${{ steps.ver.outputs.version }}-windows-x64-setup.exe /VERYSILENT /NORESTART`
          files: dist/installer/*.exe
          make_latest: "true"
