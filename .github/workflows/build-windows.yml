name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the installer (e.g. 0.1.0)"
        default: "0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the installer to a release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build app with PyInstaller
        working-directory: packaging
        run: pyinstaller kobefinance.spec --noconfirm

      - name: Sanity-check the build output
        shell: bash
        run: test -f packaging/dist/KobeFinanceTerminal/KobeFinanceTerminal.exe

      - name: Move build to repo root for Inno Setup
        shell: bash
        run: |
          mkdir -p dist
          mv packaging/dist/KobeFinanceTerminal dist/KobeFinanceTerminal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KobeFinanceTerminal-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/installer/*.exe

      - name: Attach installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
