[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kobefinance-terminal"
version = "0.1.0"
description = "KobeFinance Terminal — a native desktop financial intelligence workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "KobePay Tech" }]
dependencies = [
    "PySide6>=6.6",
    "yfinance>=0.2",
    "requests>=2.28",
    "pdfplumber>=0.10",
    "certifi>=2023.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kobefinance = "kobefinance.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
