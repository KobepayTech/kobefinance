name = "kobefinance-subscribe"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public config (non-secret). Override per environment as needed.
[vars]
ALLOWED_ORIGIN = "https://kobepaytech.github.io"
SUCCESS_URL = "https://kobepaytech.github.io/kobefinance/?checkout=success"
CANCEL_URL = "https://kobepaytech.github.io/kobefinance/?checkout=cancel"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put PRICE_PRO
# (PRICE_PRO is a Stripe Price ID, not secret, but keeping it out of source is fine.)

# Optional: persist the launch list in KV. Create the namespace, then paste its
# id below and uncomment.
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "<your-kv-namespace-id>"
